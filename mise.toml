[tools]
node = "26"
pnpm = "12"

[env]
_.path = ['{{config_root}}/node_modules/.bin']

[tasks]
build-userscript = "tsdown"
start-server = "node src/app.ts"
watch-server = "node --watch src/app.ts"
test = "node --test 'src/**/*.test.ts'"

db-generate = "drizzle-kit generate && node ./tools/patchMigrations.ts"
db-migrate = "drizzle-kit migrate"

[tasks.db-push]
run = [{ task = "db-generate" }, { task = "db-migrate" }]
