[tools]
node = "26"
pnpm = "12"

[env]
_.path = ['{{config_root}}/node_modules/.bin']

[tasks]
test = "node --test 'packages/*/src/**/*.test.ts' 'packages/userscript/tools/*.test.mts'"
typecheck = "tsc -b && pnpm --filter @bank-scraper/admin run check"

[tasks.build-userscript]
dir = "packages/userscript"
run = "pnpm exec tsdown"

[tasks.dev-admin]
dir = "packages/admin"
run = "pnpm exec vite"

[tasks.build-admin]
dir = "packages/admin"
run = "pnpm exec vite build"

[tasks.start-server]
dir = "packages/api"
run = "node src/server.ts"

[tasks.watch-server]
dir = "packages/api"
run = "node --watch src/server.ts"

[tasks.local-server]
dir = "packages/api"
run = "node --env-file=local/dev.env --watch src/server.ts"

[tasks.db-generate]
dir = "packages/api"
run = "pnpm exec drizzle-kit generate && node ./tools/patchMigrations.ts"

[tasks.db-migrate]
dir = "packages/api"
run = "pnpm exec drizzle-kit migrate"

[tasks.db-push]
run = [{ task = "db-generate" }, { task = "db-migrate" }]
