info:
  name: Create Raw Transactions
  type: http
  seq: 3

http:
  method: POST
  url: "{{baseUrl}}/api/transactions/raw"
  body:
    type: json
    data: |-
      [{
        "bankId": "1",
        "data": {{transaction}}
      }]
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
