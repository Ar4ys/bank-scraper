info:
  name: Create Raw Transactions
  type: http
  seq: 3

http:
  method: POST
  url: "{{baseUrl}}/api/transactions/raw"
  headers:
    - name: x-api-key
      value: "{{ingestApiKey}}"
  body:
    type: json
    data: |-
      {
        "sourceAccount": "{{sourceAccount}}",
        "transactions": [{
          "bankId": "1",
          "data": {{transaction}}
        }]
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
