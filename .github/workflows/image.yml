# Checks every push to main and publishes it as the Docker image ghcr.io/ar4ys/bank-scraper.
#
#   latest        the newest green build of main
#   sha-<commit>  immutable, for rolling back

name: Image

on:
  workflow_dispatch:
  push:
    branches:
      - main

env:
  REGISTRY: ghcr.io

permissions:
  contents: read

# Queued instead of cancelled, so that an older run can never move `latest` after a newer one
concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: Test, typecheck, lint and format
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out the repo
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false

      - name: Install the tools from mise.toml
        uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3.6.3

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test
        run: mise run test

      - name: Typecheck
        run: mise run typecheck

      - name: Lint
        run: mise exec -- oxlint

      - name: Check formatting
        run: mise exec -- oxfmt --check

  build:
    name: Build the ${{ matrix.platform }} image
    needs: [check]

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: amd64
            runs-on: ubuntu-24.04
          - platform: arm64
            runs-on: ubuntu-24.04-arm

    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 30

    permissions:
      contents: read
      packages: write

    outputs:
      image: ${{ steps.state.outputs.image }}

    steps:
      - name: Check out the repo
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false

      - name: Read the image name and commit
        id: state
        shell: bash
        run: |
          set -euo pipefail
          {
            # Docker rejects uppercase image names, and the repository owner has some.
            echo "image=${REGISTRY}/${GITHUB_REPOSITORY,,}"
            echo "commit=$(git rev-parse --short HEAD)"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Log in to the container registry
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish the linux/${{ matrix.platform }} image by digest
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        id: build
        with:
          context: .
          build-args: APP_GIT_COMMIT=${{ steps.state.outputs.commit }}
          platforms: linux/${{ matrix.platform }}
          cache-from: type=registry,ref=${{ steps.state.outputs.image }}:cache-${{ matrix.platform }}
          cache-to: type=registry,ref=${{ steps.state.outputs.image }}:cache-${{ matrix.platform }},mode=max
          provenance: false
          push: true
          # `oci-mediatypes=true` is what makes the annotations show up on the merged manifest:
          # https://github.com/docker/build-push-action/discussions/1022
          outputs: type=image,name=${{ steps.state.outputs.image }},name-canonical=true,push-by-digest=true,oci-mediatypes=true

      - name: Export the image digest
        shell: bash
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          mkdir -p "${RUNNER_TEMP}/digests"
          echo "${DIGEST#sha256:}" > "${RUNNER_TEMP}/digests/digest-${PLATFORM}"

      - name: Upload the image digest
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: digest-${{ matrix.platform }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Merge the multi-arch manifest and push the tags
    needs: [build]
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    permissions:
      packages: write

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Download the image digests
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          path: ${{ runner.temp }}/digests
          pattern: digest-*
          merge-multiple: true

      - name: Log in to the container registry
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Merge and push the image
        shell: bash
        env:
          IMAGE: ${{ needs.build.outputs.image }}
          DIGESTS_DIR: ${{ runner.temp }}/digests
        run: |
          set -euo pipefail

          docker buildx imagetools create \
            --annotation "index:org.opencontainers.image.created=$(date -Iseconds)" \
            --annotation "index:org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --annotation "index:org.opencontainers.image.revision=${GITHUB_SHA}" \
            --tag "${IMAGE}:latest" \
            --tag "${IMAGE}:sha-${GITHUB_SHA}" \
            "${IMAGE}@sha256:$(< "${DIGESTS_DIR}/digest-amd64")" \
            "${IMAGE}@sha256:$(< "${DIGESTS_DIR}/digest-arm64")"
